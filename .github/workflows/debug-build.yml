name: Android CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source and native submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses and install toolchain
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            'platform-tools' \
            'platforms;android-37.0' \
            'build-tools;37.0.0' \
            'ndk;28.2.13676358' \
            'cmake;3.22.1'

      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and lint
        run: ./gradlew --no-daemon --stacktrace testStandardDebugUnitTest lintStandardDebug

      - name: Assemble eXcap standard debug APK
        run: ./gradlew --no-daemon --stacktrace assembleStandardDebug

      - name: Stage branded APK and checksum
        shell: bash
        run: |
          mkdir -p dist
          apk="dist/eXcap-${GITHUB_SHA::12}-debug.apk"
          cp app/build/outputs/apk/standard/debug/app-standard-debug.apk "$apk"
          sha256sum "$apk" > "${apk}.sha256"

      - name: Upload installable APK and reports
        uses: actions/upload-artifact@v4
        with:
          name: eXcap-standard-debug-${{ github.run_number }}
          path: |
            dist/
            app/build/reports/lint-results-standardDebug.html
            app/build/reports/tests/testStandardDebugUnitTest/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish tagged APK
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download verified APK artifact
        uses: actions/download-artifact@v4
        with:
          pattern: eXcap-standard-debug-*
          merge-multiple: true

      - name: Locate verified APK files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          release_name = "${{ github.ref_name }}"
          apk = next(Path('.').rglob('eXcap-*-debug.apk'))
          checksum = next(Path('.').rglob('eXcap-*-debug.apk.sha256'))
          shutil.copy2(apk, Path(f'eXcap-{release_name}-debug.apk'))
          shutil.copy2(checksum, Path(f'eXcap-{release_name}-debug.apk.sha256'))
          PY

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            eXcap-${{ github.ref_name }}-debug.apk
            eXcap-${{ github.ref_name }}-debug.apk.sha256
          generate_release_notes: true
